# ==============================
# Configuration SonarQube Frontend Angular
# ==============================

# Identifiant unique du projet
sonar.projectKey=air-sphere-connect-frontend
sonar.projectName=AirSphere Connect - Frontend
sonar.projectVersion=1.0.0

# Encodage des fichiers sources
sonar.sourceEncoding=UTF-8

# Répertoires source et tests
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/documentation/**,**/*.js,**/*.d.ts

# TypeScript/JavaScript
sonar.typescript.lcov.reportPaths=coverage/air-sphere-connect-front/lcov.info

# Niveau de log
sonar.log.level=INFO

# URL du serveur SonarQube (localhost en dev)
sonar.host.url=http://localhost:9000

# Token d'authentification (à générer depuis SonarQube UI)
# sonar.token=YOUR_SONARQUBE_TOKEN
