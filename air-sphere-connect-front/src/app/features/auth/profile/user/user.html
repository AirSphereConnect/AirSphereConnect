@if (user) {
  <div class="flex flex-col gap-6">

    <!-- Card : Informations personnelles -->
    <div class="card bg-base-100 shadow-sm">
      <div class="card-body">
        <h2 class="card-title text-lg mb-4">Informations personnelles</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="flex flex-col gap-2">
            <label for="username-input" class="label font-bold text-sm">Nom utilisateur</label>
            <input id="username-input" type="text" class="input input-bordered w-full" [value]="user.username" disabled autocomplete="username"/>
            <app-button
              type="button"
              variant="outline"
              color="primary"
              size="sm"
              heroIcon="edit"
              (buttonClick)="editUser()"
              (buttonKeydown)="undefined"
            >
              Modifier
            </app-button>
          </div>

          <div class="flex flex-col gap-2">
            <label for="email-input" class="label font-bold text-sm">Email</label>
            <input id="email-input" type="text" class="input input-bordered w-full" [value]="user.email" disabled autocomplete="email"/>
            <app-button
              type="button"
              variant="outline"
              color="primary"
              size="sm"
              heroIcon="edit"
              (buttonClick)="editEmail()"
              (buttonKeydown)="undefined"
            >
              Modifier
            </app-button>
          </div>

          <div class="flex flex-col gap-2">
            <label for="role-input" class="label font-bold text-sm">Rôle</label>
            <input id="role-input" type="text" class="input input-bordered w-full" [value]="user.role" disabled autocomplete="off"/>
          </div>
        </div>
      </div>
    </div>

    <!-- Card : Adresse -->
    @if (user.address) {
      <div class="card bg-base-100 shadow-sm">
        <div class="card-body">
          <h2 class="card-title text-lg mb-4">Adresse</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="flex flex-col gap-2">
              <label for="street-input" class="label font-bold text-sm">Rue</label>
              <input id="street-input" type="text" class="input input-bordered w-full" [value]="user.address.street" disabled [autocomplete]="'street-address'"/>
            </div>

            <div class="flex flex-col gap-2">
              <label for="city-input" class="label font-bold text-sm">Ville</label>
              <input id="city-input" type="text" class="input input-bordered w-full" [value]="user.address.city.name" disabled autocomplete="address-level2"/>
            </div>

            <div class="flex flex-col gap-2">
              <label for="postal-code-input" class="label font-bold text-sm">Code postal</label>
              <input id="postal-code-input" type="text" class="input input-bordered w-full" [value]="user.address.city.postalCode" disabled autocomplete="postal-code"/>
            </div>
          </div>
          <div class="mt-4">
            <app-button
              type="button"
              variant="outline"
              color="primary"
              size="sm"
              heroIcon="edit"
              (buttonClick)="editAddress()"
              (buttonKeydown)="undefined"
            >
              Modifier l'adresse
            </app-button>
          </div>
        </div>
      </div>
    }

    <!-- Card : Sécurité -->
    <div class="card bg-base-100 shadow-sm">
      <div class="card-body">
        <h2 class="card-title text-lg mb-4">Sécurité</h2>
        <app-button
          type="button"
          variant="outline"
          color="primary"
          size="sm"
          heroIcon="lockClosed"
          (buttonClick)="editPassword()"
          (buttonKeydown)="undefined"
        >
          Modifier le mot de passe
        </app-button>

        <div class="divider"></div>

        <div>
          <p class="text-sm text-base-content/60 mb-3">Cette action est irréversible.</p>
          <app-button
            color="error"
            variant="outline"
            size="sm"
            type="button"
            heroIcon="trash"
            (buttonClick)="deleteUser(user.id)"
            (buttonKeydown)="undefined"
          >
            Supprimer mon compte
          </app-button>
        </div>
      </div>
    </div>

  </div>
}


<app-user-form
  [isOpen]="isUserModalOpen"
  [editingUserId]="editingUserId"
  [initialUserData]="initialUserData"
  (closeModal)="onUserModalClose()"
  (updated)="userService.fetchUserProfile()">
</app-user-form>

<app-email-form
  [isOpen]="isEmailModalOpen"
  [editingUserId]="editingUserId"
  [initialEmailData]="initialEmailData"
  (closeModal)="onEmailModalClose()"
  (updated)="userService.fetchUserProfile()">
</app-email-form>

<app-password-form
  [isOpen]="isPasswordModalOpen"
  [editingUserId]="editingUserId"
  [initialPasswordData]="initialPasswordData"
  (closeModal)="onPasswordModalClose()"
  (updated)="userService.fetchUserProfile()">
</app-password-form>

<app-address-form
  [isOpen]="isAddressModalOpen"
  [editingUserId]="editingUserId"
  [addressData]="initialAddressData"
  (closeEvent)="onAddressModalClose()"
  (updated)="userService.fetchUserProfile()">
</app-address-form>

<app-warning-message
  [isOpen]="isWarningOpen"
  [message]="warningMessage()"
  (close)="isWarningOpen.set(false)"
  (confirm)="confirmDelete()"
></app-warning-message>
