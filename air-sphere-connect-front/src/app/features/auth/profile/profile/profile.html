<div class="max-w-[1600px] mx-auto p-6">
  @if (user) {
    <header class="mb-8 pb-5 border-b-2 border-base-300">
      <h1 class="text-3xl font-bold text-base-content">Bienvenue {{ user.username }}</h1>
    </header>
  }
  <app-tab [tabs]="tabs" [activeTabIndex]="activeTabIndex" navClass="tabs-lift"></app-tab>

  <ng-template #profilUser>
    <app-user-dashboard [user]="user"></app-user-dashboard>
  </ng-template>

  <ng-template #thread>
    <app-thread-list ></app-thread-list>
  </ng-template>

  <ng-template #favorites>
    <app-favorites [user]="user"></app-favorites>
  </ng-template>

  <ng-template #alerts>
    <app-alerts [user]="user"></app-alerts>
  </ng-template>

  <router-outlet></router-outlet>

</div>
