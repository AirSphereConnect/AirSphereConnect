<div class="flex justify-center min-h-screen p-4 bg-base-200">
  <div class="w-full max-w-md">
    <div class="card bg-base-100 shadow-lg">
      <div class="card-body flex flex-col items-center lg:items-start">
        <h2 class="card-title text-primary/90 text-2xl lg:text-4xl font-bold mb-16">Connexion</h2>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col w-full gap-6">

          <app-input
            label="Nom d'utilisateur"
            type="text"
            [control]="usernameControl"
            [required]="true"
            iconLeft="user"
            placeholder="Entrez votre identifiant"
            [autocomplete]="'username'"
            fieldName="username"
          ></app-input>

          <app-input
            label="Mot de passe"
            [type]="passwordType()"
            [control]="passwordControl"
            [required]="true"
            iconLeft="lockClosed"
            [iconRight]="passwordIcon()"
            (iconRightClick)="togglePasswordVisibility()"
            placeholder="••••••••"
            [autocomplete]="'current-password'"
          ></app-input>

          <app-button
            type="submit"
            [fullWidth]="true"
            [disabled]="loginForm.invalid"
            [loading]="isLoading()"
            (buttonKeydown)="undefined"
          >
            {{ isLoading() ? 'Connexion...' : 'Connexion' }}
          </app-button>
        </form>

        <div class="divider">OU</div>
        <a routerLink="/auth/register" class="btn btn-outline btn-info  btn-block">
          Créer un compte
        </a>

      </div>
    </div>
  </div>
</div>
