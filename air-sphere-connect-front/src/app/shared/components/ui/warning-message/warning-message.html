@if (isOpen()) {
  <app-modals (close)="closeModal.emit()">
    <p>{{ message }}</p>
    <app-button
      (buttonClick)="confirm.emit()"
      (buttonKeydown)="undefined"
    >Confirmer</app-button>
    <app-button-close-modal
      (close)="closeModal.emit()">
    </app-button-close-modal>
  </app-modals>
}
