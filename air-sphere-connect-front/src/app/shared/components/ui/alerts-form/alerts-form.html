@if (isOpen()) {
  <div class="fixed inset-0 flex items-center bg-white/5 backdrop-blur-sm justify-center z-50">
    <div class="bg-base-100 shadow-2xl p-6 rounded-2xl w-full max-w-md relative">
      <app-button-close-modal
        (closeModal)="onClose()">
      </app-button-close-modal>
      <h3 class="text-lg font-bold mb-4">
        {{ editingAlertsId ? 'Modifier l\'alerte' : 'Ajouter une alerte' }}
      </h3>

      <form [formGroup]="alertsForm" (ngSubmit)="submitForm()">
        <div class="block mb-2 font-semibold">Alerte activée</div>
        <label class="flex items-center gap-2 mb-4">
          <input type="checkbox" formControlName="activeAlert" class="checkbox checkbox-primary" autocomplete="off"/>
          <span>Activer cette alerte</span>
        </label>

        <app-input
          formControlName="cityName"
          (input)="onCityInput($event)"
          label="Ville"
          autocomplete="off"
        ></app-input>

        <div class="rounded mt-2 max-h-32 overflow-y-auto">
          @if (citySuggestions().length) {
            @for (city of citySuggestions(); track city.id) {
              <app-button
                color="neutral"
                class="btn-outline block w-full text-left px-2 py-1"
                (buttonClick)="selectCity(city)">
                (buttonKeydown)="undefined"
                {{ city.name }}
              </app-button>
            }
          }
        </div>

        <div class="flex justify-end gap-2 mt-4">
          <app-button
            type="submit"
            (buttonKeydown)="undefined"
          >
            {{ editingAlertsId ? 'Modifier' : 'Ajouter' }}
          </app-button>
        </div>
      </form>
    </div>
  </div>
}
