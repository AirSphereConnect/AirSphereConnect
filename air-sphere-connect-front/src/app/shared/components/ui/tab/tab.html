<div role="tablist" [class]="navClasses() + ' ' + navClass">
  <ng-container>
    @for (tab of tabs; track tab.label; let i = $index) {
      <button
        type="button"
        role="tab"
        [class]="getTabClasses(i)"
        [attr.tabindex]="0"
        (click)="setActive(i)"
        (keydown.enter)="setActive(i)"
        (keydown.space)="setActive(i)">
        @if (tab.labelTemplate) {
          <ng-container [ngTemplateOutlet]="tab.labelTemplate"></ng-container>
        } @else {
          {{ tab.label }}
        }
      </button>
    }
  </ng-container>
</div>

<section role="tabpanel" [class]="panelClasses()">
  <ng-container>
    @for (tab of tabs; track tab.label; let i = $index) {
      @if (activeIndex() === i) {
        <ng-container [ngTemplateOutlet]="tab.template"></ng-container>
      }
    }
  </ng-container>
</section>
