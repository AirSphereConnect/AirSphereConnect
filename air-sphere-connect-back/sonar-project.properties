# ==============================
# Configuration SonarQube Backend Java/Spring Boot
# ==============================

# Identifiant unique du projet
sonar.projectKey=air-sphere-connect-backend
sonar.projectName=AirSphere Connect - Backend
sonar.projectVersion=1.0.0

# Encodage des fichiers sources
sonar.sourceEncoding=UTF-8

# Répertoires source et tests
sonar.sources=src/main/java
sonar.tests=src/test/java

# Répertoires de bytecode compilé (pour analyse approfondie)
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Répertoires de librairies (optionnel mais recommandé)
sonar.java.libraries=target/**/*.jar

# Exclusions
sonar.exclusions=**/target/**,**/*.xml,**/*.yml,**/*.yaml,**/*.properties

# Couverture de code (si JaCoCo est configuré)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Niveau de log
sonar.log.level=INFO

# URL du serveur SonarQube (localhost en dev)
sonar.host.url=http://localhost:9000

# Token d'authentification (Ã  générer depuis SonarQube UI)
# sonar.token=YOUR_SONARQUBE_TOKEN
